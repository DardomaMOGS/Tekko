<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TEKKO AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- HEADER -->
        <header class="topbar">

            <div class="brand">

                <div class="logo">
                    T
                </div>

                <div class="brand-text">
                    <h1>TEKKO</h1>
                    <span>AI Assistant</span>
                </div>

            </div>

            <button
                id="clearButton"
                class="clear-button"
                title="Clear conversation"
                type="button"
            >
                🗑️
            </button>

        </header>


        <!-- CHAT -->
        <main id="chat" class="chat">

            <section id="welcome" class="welcome">

                <div class="welcome-logo">
                    T
                </div>

                <h2>
                    Hey! I'm TEKKO 🤖
                </h2>

                <p>
                    Your personal AI assistant.
                </p>

                <div class="suggestions">

                    <button
                        class="suggestion"
                        data-message="Give me a cool project idea"
                        type="button"
                    >
                        💡 Give me an idea
                    </button>

                    <button
                        class="suggestion"
                        data-message="Help me with coding"
                        type="button"
                    >
                        💻 Help with coding
                    </button>

                    <button
                        class="suggestion"
                        data-message="Tell me something interesting"
                        type="button"
                    >
                        🧠 Tell me something
                    </button>

                </div>

            </section>

        </main>


        <!-- INPUT -->
        <form id="chatForm" class="input-area">

            <textarea
                id="messageInput"
                placeholder="Message TEKKO..."
                rows="1"
                autocomplete="off"
            ></textarea>

            <button
                id="sendButton"
                type="submit"
                aria-label="Send message"
            >
                ➤
            </button>

        </form>


        <footer>
            TEKKO AI v1.0 • Local Prototype
        </footer>

    </div>


    <script src="script.js"></script>

</body>
</html>
